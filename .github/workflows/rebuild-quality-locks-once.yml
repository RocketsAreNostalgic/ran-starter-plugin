name: Rebuild shared-quality locks once

on:
  push:
    branches:
      - chore/adopt-ran-quality-packages

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor == 'bnjmnrsh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Verify trusted branch revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "${GITHUB_REF_NAME}" = "chore/adopt-ran-quality-packages"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.13.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'

      - name: Rebuild Composer lock without executing package code
        run: |
          set -euo pipefail
          composer update \
            ran/coding-standards \
            phpcompatibility/php-compatibility \
            phpcompatibility/phpcompatibility-paragonie \
            phpcompatibility/phpcompatibility-wp \
            --with-dependencies \
            --no-install \
            --no-scripts \
            --no-plugins \
            --no-interaction
          composer validate --strict --no-check-publish --no-check-all
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
            $packages = array_merge($lock["packages"] ?? [], $lock["packages-dev"] ?? []);
            foreach ($packages as $package) {
                if (($package["name"] ?? "") === "ran/coding-standards") {
                    if (($package["source"]["reference"] ?? "") !== "0b03e61a4bb558deeb6bc6b6399f44c0ec95e5be") {
                        fwrite(STDERR, "Unexpected ran/coding-standards source reference\n");
                        exit(1);
                    }
                    exit(0);
                }
            }
            fwrite(STDERR, "ran/coding-standards missing from composer.lock\n");
            exit(1);
          '

      - name: Rebuild pnpm lock without executing package code
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
          grep -q '751edd097e3902efb93992bf47401a1a4f4b1fa8' pnpm-lock.yaml

      - name: Commit locks and remove one-shot workflow
        run: |
          set -euo pipefail
          git diff --exit-code -- composer.json package.json .phpcs.xml eslint.config.js .stylelintrc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock pnpm-lock.yaml
          git rm .github/workflows/rebuild-quality-locks-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh shared quality locks"
          git push origin HEAD:chore/adopt-ran-quality-packages
