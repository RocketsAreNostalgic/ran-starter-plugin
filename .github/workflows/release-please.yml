name: Release Please

on:
    workflow_run:
        workflows: [Quality]
        types: [completed]
        branches: [main]

permissions: {}

concurrency:
    group: release-please-main
    cancel-in-progress: false

jobs:
    release-please:
        if: >-
            ${{
                github.event.workflow_run.event == 'push'
                && github.event.workflow_run.conclusion == 'success'
                && github.event.workflow_run.head_branch == 'main'
                && github.event.workflow_run.head_repository.id == github.repository_id
                && github.event.workflow_run.head_repository.full_name == github.repository
            }}
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: write
            issues: write
            pull-requests: write
        steps:
            - name: Resolve exact successful Quality evidence
              id: quality
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
                  RAN_QUALITY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
                  RAN_QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
              run: |
                  set -euo pipefail
                  [[ "$RAN_QUALITY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$RAN_QUALITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                  [[ "$RAN_QUALITY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

                  workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml")"
                  workflow_id="$(jq -er '.id' <<< "$workflow")"
                  evidence="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RAN_QUALITY_RUN_ID}")"
                  jq -e \
                      --arg commit "$RAN_QUALITY_COMMIT" \
                      --arg repository "$GITHUB_REPOSITORY" \
                      --argjson run_attempt "$RAN_QUALITY_RUN_ATTEMPT" \
                      --argjson run_id "$RAN_QUALITY_RUN_ID" \
                      --argjson workflow_id "$workflow_id" \
                      '.id == $run_id
                        and .run_attempt == $run_attempt
                        and .workflow_id == $workflow_id
                        and .name == "Quality"
                        and .path == ".github/workflows/quality.yml"
                        and .event == "push"
                        and .status == "completed"
                        and .conclusion == "success"
                        and .head_branch == "main"
                        and .head_repository.full_name == $repository
                        and .repository.full_name == $repository
                        and .head_sha == $commit
                        and .head_commit.id == $commit' \
                      <<< "$evidence" >/dev/null

                  printf 'commit=%s\n' "$RAN_QUALITY_COMMIT" >> "$GITHUB_OUTPUT"

            - name: Check out exact qualified commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ steps.quality.outputs.commit }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify exact qualified checkout
              env:
                  RAN_QUALITY_COMMIT: ${{ steps.quality.outputs.commit }}
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$RAN_QUALITY_COMMIT"

            - name: Reject stale Quality trigger before Release Please
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ steps.quality.outputs.commit }}
              run: |
                  set -euo pipefail
                  current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
                  test "$current_main" = "$RAN_QUALITY_COMMIT"

            - name: Open, update, or publish the Release Please release
              id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            - name: Read back exact created release
              if: steps.release.outputs.release_created == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ steps.quality.outputs.commit }}
                  RAN_RELEASE_SHA: ${{ steps.release.outputs.sha }}
                  RAN_TAG_NAME: ${{ steps.release.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  test "$RAN_RELEASE_SHA" = "$RAN_QUALITY_COMMIT"
                  [[ "$RAN_TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

                  release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_TAG_NAME}")"
                  jq -e \
                      --arg commit "$RAN_QUALITY_COMMIT" \
                      --arg tag "$RAN_TAG_NAME" \
                      '.tag_name == $tag
                        and .target_commitish == $commit
                        and .draft == false
                        and (.assets | length) == 0' \
                      <<< "$release_json" >/dev/null

                  tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_TAG_NAME}")"
                  tag_type="$(jq -er '.object.type' <<< "$tag_ref")"
                  tag_commit="$(jq -er '.object.sha' <<< "$tag_ref")"
                  peel_count=0
                  while [[ "$tag_type" == tag ]]; do
                      ((peel_count += 1))
                      test "$peel_count" -le 8
                      tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_commit}")"
                      tag_type="$(jq -er '.object.type' <<< "$tag_object")"
                      tag_commit="$(jq -er '.object.sha' <<< "$tag_object")"
                  done
                  test "$tag_type" = commit
                  test "$tag_commit" = "$RAN_QUALITY_COMMIT"
